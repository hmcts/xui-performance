plugins {
    id 'performance'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

performance {
    simulationClass = 'simulations.XUI_Simulation'
}

// Disable Gatling Enterprise packaging task for local Gatling execution
tasks.configureEach {
    if (name == "gatlingEnterprisePackage") {
        enabled = false
    }
}
